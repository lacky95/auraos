services:
  aura-os:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: aura-shell
    hostname: aura-shell
    # Auto-recover after a host reboot or docker daemon restart. Without
    # this the master container stays down until someone runs `compose up`
    # again, while the sibling sidecars (spawned with --restart
    # unless-stopped) come back on their own — leaving the OS headless.
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - aura-node-modules:/workspace/node_modules
      - aura-app-data:/data
      # Sibling-container model: the AppManager can spawn additional
      # containers as siblings (sandbox: 'container' apps) by talking to
      # the host's docker daemon. Mounting the socket effectively grants
      # AuraOS root on the host — acceptable for single-user dev, NOT for
      # multi-tenant prod. The host paths in -v args inside ContainerRunner
      # are passed verbatim to the host daemon, which is why AURA_HOST_WORKSPACE
      # below points at the host's view of /workspace (the bind source
      # of `.:/workspace` above).
      #
      # NOTE for macOS (Docker Desktop / Rancher Desktop / OrbStack): the
      # daemon lives inside a Linux VM and resolves both sides of this bind
      # against the VM, where /var/run/docker.sock IS the daemon socket — so
      # this path is correct on Mac too, even when the host-side symlink at
      # /var/run/docker.sock is absent (e.g. Rancher without admin access).
      # On the host, set DOCKER_HOST to the VM-forwarded socket
      # (e.g. unix://$HOME/.rd/docker.sock) before running `make up`.
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      NODE_ENV: development
      AURA_APPS_DIR: /workspace/apps
      AURA_DATA_DIR: /data
      AURA_BASE_ROOTFS: /os/base-rootfs
      AURA_TOOLCHAIN_DIR: /os/toolchain
      AURA_APP_PORT_START: "4001"
      AURA_APP_PORT_END: "4999"
      AURA_AUTH_MODE: none
      AURA_USE_PROOT: "true"
      # The host-side absolute path that's bind-mounted at /workspace above.
      # ContainerRunner passes this to `docker -v` as the bind source for
      # sibling containers (they share the host's filesystem, not this
      # container's namespaced view). Set to the host project root if
      # different from /workspace.
      AURA_HOST_WORKSPACE: ${AURA_HOST_WORKSPACE:-${PWD}}
      AURA_DOCKER_NETWORK: aura-net
      AURA_BASE_IMAGE: aura-base
      AURA_SHELL_HOSTNAME: aura-shell
      # Sibling containers mount the same node_modules + app-data named volumes
      # the shell's pnpm install populated. Compose prefixes volume names with
      # the project name (`<project>_<volume>`), which depends on the directory
      # / COMPOSE_PROJECT_NAME. ContainerRunner AUTO-DISCOVERS the real names
      # from the shell's own mounts, so nothing needs pinning here — it works
      # whatever the directory is called. Uncomment and set these ONLY to force
      # an override (e.g. a remote docker daemon where self-inspect can't run):
      # AURA_NODE_MODULES_VOLUME: myproject_aura-node-modules
      # AURA_APP_DATA_VOLUME: myproject_aura-app-data
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    dns:
      - 8.8.8.8
      - 1.1.1.1
    stdin_open: true
    tty: true
    networks:
      - aura-net

networks:
  aura-net:
    name: aura-net
    driver: bridge

volumes:
  aura-node-modules:
  aura-app-data:
