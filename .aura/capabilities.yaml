capabilities:
  aura:
    source: builtin
    binary: aura
    description: AuraOS CLI itself (forward into PRoots)
  # Agent CLIs: `tags: [agent]` and `login_probe` (files under the home that
  # mean "logged in") feed the welcome checklist; `aliases` are other names
  # an app's `tools[]` may use for the binary. A `*` in `binary_path` matches
  # the platform package npm installed on this machine (any architecture).
  claude:
    source: npm
    package: "@anthropic-ai/claude-code"
    binary: claude
    aliases: [claude-code]
    tags: [agent]
    login_probe: [.claude/.credentials.json]
    description: Claude Code CLI
  codex:
    source: npm
    package: "@openai/codex"
    binary: codex
    binary_path: /usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-*/vendor/*-unknown-linux-musl/bin/codex
    tags: [agent]
    login_probe: [.codex/auth.json]
    description: OpenAI Codex CLI
  copilot:
    source: npm
    package: "@github/copilot"
    binary: copilot
    binary_path: /usr/local/lib/node_modules/@github/copilot/node_modules/@github/copilot-linux-*/copilot
    description: GitHub Copilot CLI
  ssh:
    source: apt
    package: openssh-client
    binary: ssh
    description: SSH client for remote connections
  rg:
    source: apt
    package: ripgrep
    binary: rg
    description: ripgrep — fast recursive grep
  htop:
    source: apt
    package: htop
    binary: htop
    description: Interactive process viewer
  nano:
    source: apt
    package: nano
    binary: nano
    description: Nano — small terminal text editor
  jq:
    source: apt
    package: jq
    binary: jq
    description: Command-line JSON processor
  fzf:
    source: apt
    package: fzf
    binary: fzf
    description: Fuzzy finder
  gh:
    source: apt
    package: gh
    binary: gh
    description: GitHub CLI
  # Install definitions are data (SF-2): a fixed set of structured steps the
  # master runs as argv, never a shell command. Downloads are https and pinned
  # by sha256. Writes land under /usr/local/bin, /usr/local/lib or
  # /home/aura/.aura. See packages/core/src/capabilities/definition.ts.
  linux-coreutils:
    source: steps
    steps:
      - apt: [iputils-ping, iputils-tracepath, traceroute, curl, wget, iproute2, dnsutils,
          netcat-openbsd, socat, net-tools, tcpdump, mtr-tiny, whois, rsync, tree, psmisc,
          strace, unzip, zip, xz-utils]
      - file:
          path: /usr/local/bin/linux-coreutils
          mode: "0755"
          content: |
            #!/bin/sh
            # linux-coreutils — AuraOS capability shim. The tools below are this
            # capability's sidecars; granting `linux-coreutils` puts them on PATH.
            tools="ping tracepath traceroute curl wget ip ss dig nslookup host nc
            socat netstat ifconfig route arp tcpdump mtr mtr-packet whois rsync tree
            killall pstree fuser strace unzip zip xz"
            case "${1:---help}" in
              -h|--help)
                echo "linux-coreutils: network + core utilities bundled as one AuraOS capability."
                echo "Run 'linux-coreutils --check' to verify each tool resolves on PATH."
                echo "Tools:"
                for t in $tools; do echo "  $t"; done ;;
              --check)
                rc=0
                for t in $tools; do
                  if p=$(command -v "$t" 2>/dev/null); then printf 'ok       %-12s %s\n' "$t" "$p"
                  else printf 'MISSING  %s\n' "$t"; rc=1; fi
                done
                exit $rc ;;
              *) echo "usage: linux-coreutils [--help|--check]" >&2; exit 2 ;;
            esac
    binary_path: /usr/local/bin/linux-coreutils
    binary: linux-coreutils
    sidecars:
      - /usr/bin/ping
      - /usr/bin/tracepath
      - /usr/bin/traceroute
      - /usr/bin/curl
      - /usr/bin/wget
      - /usr/bin/ip
      - /usr/bin/ss
      - /usr/bin/dig
      - /usr/bin/nslookup
      - /usr/bin/host
      - /usr/bin/nc
      - /usr/bin/socat
      - /usr/bin/netstat
      - /usr/sbin/ifconfig
      - /usr/sbin/route
      - /usr/sbin/arp
      - /usr/bin/tcpdump
      - /usr/bin/mtr
      - /usr/bin/mtr-packet
      - /usr/bin/whois
      - /usr/bin/rsync
      - /usr/bin/tree
      - /usr/bin/killall
      - /usr/bin/pstree
      - /usr/bin/fuser
      - /usr/bin/strace
      - /usr/bin/unzip
      - /usr/bin/zip
      - /usr/bin/xz
    description: Network + core utilities bundle — ping, traceroute, curl, wget,
      ip/ss, dig, nc, socat, tcpdump, mtr, whois, rsync, tree, psmisc, strace,
      zip/unzip, xz
  adb:
    source: steps
    steps:
      - apt: [unzip]
      - extract:
          url: https://dl.google.com/android/repository/platform-tools_r37.0.3-linux.zip
          sha256: 214548146cadb2ca3508143d8a1d4be4c59de5bb837253e3ede89ed74cf450d1
          format: zip
          subdir: platform-tools
          to: /usr/local/lib/android-sdk-platform-tools
    binary_path: /usr/local/lib/android-sdk-platform-tools/adb
    binary: adb
    description: Android Debug Bridge — Google platform-tools r37.0.3 (has `adb pair` for
      wireless debugging)
  bun:
    source: steps
    steps:
      - apt: [unzip]
      - extract:
          url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.5/bun-linux-x64.zip
          sha256: 94559b3b528995a49452f9f2404cec74f2efd7d06e0a000a8cd214b02c3666eb
          format: zip
          subdir: bun-linux-x64
          to: /usr/local/lib/bun
    binary_path: /usr/local/lib/bun/bun
    binary: bun
    description: Bun JavaScript runtime (1.4.5)
  oras:
    source: steps
    steps:
      - extract:
          url: https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          sha256: 5b3f1cbb86d869eee68120b9b45b9be983f3738442f87ee5f06b00edd0bab336
          format: tar.gz
          members: [oras]
          to: /usr/local/bin
    binary_path: /usr/local/bin/oras
    binary: oras
    description: OCI Registry As Storage client — transport for Nexus app publish/install
  zot:
    source: steps
    steps:
      - download:
          url: https://github.com/project-zot/zot/releases/download/v2.1.7/zot-linux-amd64-minimal
          sha256: ec67564967159adc0c45a7198c112803b2acc9fbd86b1c36806698d959dd087d
          to: /usr/local/bin/zot
          mode: "0755"
    binary_path: /usr/local/bin/zot
    binary: zot
    description: OCI Distribution registry server — backs the com.aura.registry Nexus store
  code-server:
    source: steps
    steps:
      - extract:
          url: https://github.com/coder/code-server/releases/download/v4.137.0/code-server-4.137.0-linux-amd64.tar.gz
          sha256: 9303165b7fd43532091922f77e2f119ff2fa109c6b6f1c3c966fb02f3d6d9c8b
          format: tar.gz
          strip: 1
          to: /home/aura/.aura/code-server/4.137.0
          unless_exists: /home/aura/.aura/code-server/4.137.0/bin/code-server
      - symlink: { target: /home/aura/.aura/code-server/4.137.0, path: /home/aura/.aura/code-server/current }
      - mkdir: [/home/aura/.aura/code-server/data, /home/aura/.aura/code-server/extensions, /home/aura/.aura/code-server/run]
      - readable: /home/aura/.aura/code-server/4.137.0
      - file:
          path: /usr/local/bin/code-server
          mode: "0755"
          content: |
            #!/bin/sh
            exec /home/aura/.aura/code-server/current/bin/code-server "$@"
    binary_path: /usr/local/bin/code-server
    binary: code-server
    description: VS Code in the browser — standalone release in the shared home;
      shim lands on PATH in granted sandboxes
  nvm:
    source: steps
    steps:
      - mkdir: [/home/aura/.aura/nvm]
      # nvm itself is three files of its release; installed node versions in
      # /home/aura/.aura/nvm stay where they are.
      - extract:
          url: https://github.com/nvm-sh/nvm/archive/refs/tags/v0.40.8.tar.gz
          sha256: 7c5b2c4c78e6447b518860ead1f365056e9a03b3562903439bb401607b05a2ef
          format: tar.gz
          strip: 1
          members: [nvm-0.40.8/nvm.sh, nvm-0.40.8/nvm-exec, nvm-0.40.8/bash_completion]
          to: /home/aura/.aura/nvm
      - readable: /home/aura/.aura/nvm
      - file:
          path: /usr/local/bin/nvm
          mode: "0755"
          content: |
            #!/bin/sh
            # nvm — AuraOS capability shim. nvm is a shell function; this runs it in
            # a subshell, which is fine for everything that mutates $NVM_DIR and
            # impossible for anything that mutates the caller's environment.
            NVM_DIR="${NVM_DIR:-/home/aura/.aura/nvm}"
            export NVM_DIR
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "nvm: $NVM_DIR/nvm.sh is missing — run 'aura cap install nvm' on the master." >&2
              exit 1
            fi
            case "${1:-}" in
              use|deactivate|unload)
                echo "nvm: '$1' changes the calling shell, which a shim cannot do." >&2
                echo "Run this instead:  eval \"\$(nvm-env)\" && nvm $*" >&2
                echo "Or make it the default for new shells:  nvm alias default <version>" >&2
                exit 2 ;;
            esac
            . "$NVM_DIR/nvm.sh" --no-use
            # Without this guard a failed source falls through to a PATH lookup,
            # which finds this shim again and forks until the sandbox gives up.
            # POSIX `command -v` prints a bare name for a function, a path for a file.
            if [ "$(command -v nvm)" != "nvm" ]; then
              echo "nvm: sourcing $NVM_DIR/nvm.sh did not define the nvm function." >&2
              exit 1
            fi
            nvm "$@"
      - file:
          path: /usr/local/bin/nvm-env
          mode: "0755"
          content: |
            #!/bin/sh
            # nvm-env — AuraOS helper. Prints the lines that load the REAL nvm
            # function into the CURRENT shell, so `nvm use` works there.
            #   eval "$(nvm-env)"
            cat <<'ENVEOF'
            export NVM_DIR="/home/aura/.aura/nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            ENVEOF
    binary_path: /usr/local/bin/nvm
    binary: nvm
    sidecars:
      - /usr/local/bin/nvm-env
    description: Node Version Manager (v0.40.8) — node versions shared via
      /home/aura/.aura/nvm; `eval "$(nvm-env)"` for a real `nvm use`
  asdf:
    source: steps
    steps:
      - extract:
          url: https://github.com/asdf-vm/asdf/releases/download/v0.20.0/asdf-v0.20.0-linux-amd64.tar.gz
          sha256: 9c25e1af7cc4c9d59ff3736eba14fd000480c32929258f80d8c5a8b290ebee14
          format: tar.gz
          to: /home/aura/.aura/asdf/0.20.0
          unless_exists: /home/aura/.aura/asdf/0.20.0/asdf
      - symlink: { target: /home/aura/.aura/asdf/0.20.0, path: /home/aura/.aura/asdf/current }
      - mkdir: [/home/aura/.aura/asdf/data]
      - readable: /home/aura/.aura/asdf/0.20.0
      - file:
          path: /usr/local/bin/asdf
          mode: "0755"
          content: |
            #!/bin/sh
            # asdf — AuraOS capability shim. Pins the data dir to the shared home so
            # plugins and installed versions outlive the sandbox, then hands off to
            # the real static binary.
            ASDF_DATA_DIR="${ASDF_DATA_DIR:-/home/aura/.aura/asdf/data}"
            export ASDF_DATA_DIR
            exec /home/aura/.aura/asdf/current/asdf "$@"
      - file:
          path: /usr/local/bin/asdf-env
          mode: "0755"
          content: |
            #!/bin/sh
            # asdf-env — AuraOS helper. Prints the lines that put asdf's shim dir on
            # PATH in the CURRENT shell, which is what makes an installed `node` or
            # `go` runnable. The asdf shim itself cannot do it.
            #   eval "$(asdf-env)"
            cat <<'ENVEOF'
            export ASDF_DATA_DIR="/home/aura/.aura/asdf/data"
            export PATH="$ASDF_DATA_DIR/shims:$PATH"
            ENVEOF
    binary_path: /usr/local/bin/asdf
    binary: asdf
    sidecars:
      - /usr/local/bin/asdf-env
    description: asdf version manager (0.20.0, Go) — plugins/versions shared via
      /home/aura/.aura/asdf; `eval "$(asdf-env)"` puts its shims on PATH
  sshpass:
    source: apt
    binary: sshpass
    package: sshpass
  argocd:
    source: steps
    steps:
      - download:
          url: https://github.com/argoproj/argo-cd/releases/download/v3.6.3/argocd-linux-amd64
          sha256: 3750cd7ed2a2ef05c640344b86f29aa99c9783e847c8f326c81e3900ad39412b
          to: /usr/local/bin/argocd
          mode: "0755"
    binary_path: /usr/local/bin/argocd
    binary: argocd
    description: Argo CD CLI (v3.6.3) — manage Argo CD apps, clusters and repos (GitOps)
  glab:
    source: steps
    steps:
      - deb:
          url: https://gitlab.com/gitlab-org/cli/-/releases/v1.133.0/downloads/glab_1.133.0_linux_amd64.deb
          sha256: 0e957310c6cb5f324a82d335c46d58ffc165e00eacc66ca4eb338d061db93929
    binary_path: /usr/bin/glab
    binary: glab
    description: GitLab CLI (v1.133.0, official .deb via apt)
services:
  sshd:
    source: apt
    package: openssh-server
    binary: /usr/sbin/sshd
    port: 2222
    default_config: |
      Port 2222
      PermitRootLogin yes
      PasswordAuthentication yes
      UsePAM no
    start_cmd: mkdir -p /run/sshd && /usr/sbin/sshd -D -p 2222
    description: SSH server daemon (port 2222)
