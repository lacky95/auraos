packages:
  - 'packages/*'
  - 'apps/*'
  # Raw-runtime apps nest their framework root one level deeper because the
  # outer dir holds `entrypoint.sh` + the Aura manifest. The pattern keeps
  # the convention general — any future raw app with a nested framework
  # (e.g. `apps/<id>/sveltekit-site/`) is auto-registered as long as the
  # inner dir name is added below.
  - 'apps/*/fumadocs-site'
allowBuilds:
  esbuild: true
  msw: true
  node-pty: true
  sharp: true
  '@img/sharp-libvips-linux-x64': true
  redis-memory-server: set this to true or false
onlyBuiltDependencies:
  - esbuild
  - msw
  - node-pty
  - sharp
  - '@img/sharp-libvips-linux-x64'

# Workspace standardises on React 19 — that's what Radix peer-resolves to
# (Radix peerDep is `^18 || ^19`, pnpm picks the highest). Consumers declare
# `react: ^19.0.0` directly so everyone sees the same single React copy.
# No overrides needed.
