<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console — AuraOS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #ccffcc;
      font-family: 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 0.72rem;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #111;
      border-bottom: 1px solid rgba(0,255,65,.2);
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #557755;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    header .title {
      color: #00ff41;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
    }
    header .group {
      display: flex;
      gap: 2px;
      align-items: center;
      padding: 2px 6px;
      border: 1px solid rgba(0,255,65,.15);
    }
    header .group-label {
      font-size: 0.5rem;
      color: #557755;
      letter-spacing: 0.1em;
      margin-right: 4px;
    }
    .filter-btn, .source-btn {
      background: transparent;
      border: 1px solid rgba(0,255,65,.2);
      color: #557755;
      font-family: inherit;
      font-size: 0.55rem;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      cursor: pointer;
      text-transform: uppercase;
      transition: color 0.1s, border-color 0.1s;
    }
    .filter-btn[data-active="true"] { color: #00ff41; border-color: #00ff41; }
    .filter-btn[data-level="warn"][data-active="true"]  { color: #ff9900; border-color: #ff9900; }
    .filter-btn[data-level="error"][data-active="true"] { color: #ff2020; border-color: #ff2020; }
    .filter-btn[data-level="info"][data-active="true"]  { color: #00aaff; border-color: #00aaff; }
    .filter-btn[data-level="debug"][data-active="true"] { color: #888;    border-color: #888;    }

    header .spacer { flex: 1; }
    header .count-info { color: #557755; font-size: 0.55rem; }
    header .count-info b { color: #ff9900; font-weight: normal; }
    header label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.55rem;
      cursor: pointer;
    }

    .search {
      background: #050505;
      border: 1px solid rgba(0,255,65,.2);
      color: #ccffcc;
      font-family: inherit;
      font-size: 0.6rem;
      padding: 3px 8px;
      outline: none;
      width: 140px;
      letter-spacing: 0.04em;
    }
    .search:focus { border-color: #00ff41; box-shadow: 0 0 4px rgba(0,255,65,.3); }
    .search::placeholder { color: #557755; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
      line-height: 1.4;
    }
    .entry {
      display: grid;
      grid-template-columns: 78px 52px 110px 1fr;
      gap: 8px;
      padding: 2px 10px;
      border-bottom: 1px dashed rgba(0,255,65,.06);
      align-items: start;
    }
    .entry:hover { background: rgba(0,255,65,.03); }
    .entry-time   { color: #557755; font-size: 0.6rem; white-space: nowrap; }
    .entry-level  { font-size: 0.55rem; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
    .entry-level[data-level="log"]   { color: #ccffcc; }
    .entry-level[data-level="info"]  { color: #00aaff; }
    .entry-level[data-level="warn"]  { color: #ff9900; }
    .entry-level[data-level="error"] { color: #ff2020; }
    .entry-level[data-level="debug"] { color: #888888; }
    .entry-source {
      color: #557755;
      font-size: 0.6rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-source[data-source="shell"] { color: #00ff41; }
    .entry-args {
      white-space: pre-wrap;
      word-break: break-word;
      color: #ccffcc;
    }
    .entry-args[data-level="error"] { color: #ff8080; }
    .entry-args[data-level="warn"]  { color: #ffcc99; }
    .entry-args[data-level="info"]  { color: #aaccff; }
    .entry-args[data-level="debug"] { color: #888888; }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: #111;
      border-top: 1px solid rgba(0,255,65,.1);
      font-size: 0.55rem;
      color: #557755;
      letter-spacing: .08em;
      text-transform: uppercase;
      flex-shrink: 0;
      gap: 8px;
    }
    footer .meta { color: #557755; }
    footer .meta b { color: #ff9900; font-weight: normal; }
    footer button {
      background: transparent;
      border: 1px solid rgba(0,255,65,.2);
      color: #557755;
      font-family: inherit;
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      cursor: pointer;
      text-transform: uppercase;
      transition: color 0.1s, border-color 0.1s;
    }
    footer button:hover { color: #00ff41; border-color: #00ff41; }

    .empty {
      color: #557755;
      text-align: center;
      padding: 60px 0;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
    }
    .empty .blink { animation: blink 1.2s steps(2,end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---- scificn-style checkbox ----
       Built to match the @scificn/checkbox visual spec (Radix-based React in
       the original library): empty bordered square unchecked, filled square
       ■ when checked, retro sci-fi aesthetic. Native input is hidden but
       drives state via `:checked`; keyboard + screen-reader still work. */
    .sci-check {
      --sci-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #557755;
      transition: color 0.1s;
    }
    .sci-check:hover { color: #00ff41; }
    .sci-check input[type="checkbox"] {
      /* hidden visually, but still focusable + reachable by AT */
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
    }
    .sci-check-box {
      width: var(--sci-size);
      height: var(--sci-size);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #557755;
      background: transparent;
      color: #00ff41;
      font-family: inherit;
      font-size: calc(var(--sci-size) - 4px);
      line-height: 1;
      flex-shrink: 0;
      transition: border-color 0.1s, box-shadow 0.1s;
    }
    .sci-check:hover .sci-check-box {
      border-color: #00ff41;
      box-shadow: 0 0 4px rgba(0, 255, 65, 0.4);
    }
    /* glyph only renders when input is checked */
    .sci-check-box::before { content: ''; }
    .sci-check input:checked ~ .sci-check-box {
      border-color: #00ff41;
    }
    .sci-check input:checked ~ .sci-check-box::before {
      content: '■';
    }
    /* keyboard focus ring */
    .sci-check input:focus-visible ~ .sci-check-box {
      outline: 1px dashed #00ff41;
      outline-offset: 2px;
    }
    /* disabled */
    .sci-check[aria-disabled="true"],
    .sci-check input:disabled ~ .sci-check-box {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .sci-check input:checked ~ .sci-check-label { color: #00ff41; }
  </style>
</head>
<body>
  <header>
    <span class="title">▤ CONSOLE</span>

    <div class="group">
      <span class="group-label">LVL</span>
      <button class="filter-btn" data-level="log"   data-active="true">LOG</button>
      <button class="filter-btn" data-level="info"  data-active="true">INF</button>
      <button class="filter-btn" data-level="warn"  data-active="true">WRN</button>
      <button class="filter-btn" data-level="error" data-active="true">ERR</button>
      <button class="filter-btn" data-level="debug" data-active="true">DBG</button>
    </div>

    <input id="search" class="search" type="text" placeholder="FILTER..." autocomplete="off" />

    <div class="spacer"></div>

    <span class="count-info"><b id="visible-count">0</b> / <b id="total-count">0</b></span>
    <label class="sci-check" for="autoscroll">
      <input type="checkbox" id="autoscroll" checked />
      <span class="sci-check-box" aria-hidden="true"></span>
      <span class="sci-check-label">AUTOSCROLL</span>
    </label>
  </header>

  <main id="output">
    <div class="empty">// WAITING FOR CONSOLE OUTPUT<span class="blink">_</span></div>
  </main>

  <footer>
    <span class="meta">INST <b id="m-instance">…</b></span>
    <span class="meta" id="last-update">—</span>
    <span style="flex:1;"></span>
    <button id="copy-btn" title="Copy visible entries as text">COPY</button>
    <button id="clear-btn" title="Clear current buffer">CLEAR</button>
  </footer>

  <script>
    const output       = document.getElementById('output');
    const visibleCount = document.getElementById('visible-count');
    const totalCount   = document.getElementById('total-count');
    const autoscroll   = document.getElementById('autoscroll');
    const clearBtn     = document.getElementById('clear-btn');
    const copyBtn      = document.getElementById('copy-btn');
    const search       = document.getElementById('search');
    const lastUpdate   = document.getElementById('last-update');
    const mInstance    = document.getElementById('m-instance');
    const filterBtns   = document.querySelectorAll('.filter-btn');

    const MAX_ENTRIES  = 5000;
    let entries = [];
    let activeLevels = new Set(['log', 'info', 'warn', 'error', 'debug']);
    let query = '';

    // The shell injects x-aura-instance-id as a response header on the proxied
    // HTML request, but a static page can't read response headers. We read
    // ?inst=… from the URL instead — the shell adds it when constructing the
    // iframe src. Falls back to a sensible placeholder.
    const params = new URLSearchParams(location.search);
    mInstance.textContent = params.get('inst') || params.get('instance') || 'com.aura.console';

    function formatTime(ts) {
      const d = new Date(ts);
      const pad2 = (n) => String(n).padStart(2, '0');
      const pad3 = (n) => String(n).padStart(3, '0');
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}.${pad3(d.getMilliseconds())}`;
    }

    function escape(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    function filtered() {
      const q = query.trim().toLowerCase();
      return entries.filter((e) => {
        if (!activeLevels.has(e.level)) return false;
        if (!q) return true;
        if ((e.source || '').toLowerCase().includes(q)) return true;
        return e.args.some((a) => String(a).toLowerCase().includes(q));
      });
    }

    function render() {
      const list = filtered();
      visibleCount.textContent = list.length;
      totalCount.textContent   = entries.length;
      if (list.length === 0) {
        const msg = entries.length === 0
          ? 'WAITING FOR CONSOLE OUTPUT'
          : 'NO ENTRIES MATCH FILTERS';
        output.innerHTML = `<div class="empty">// ${msg}<span class="blink">_</span></div>`;
        return;
      }
      const wasNearBottom =
        output.scrollHeight - output.scrollTop - output.clientHeight < 50;

      output.innerHTML = list.map((e) => `
        <div class="entry">
          <span class="entry-time">${formatTime(e.timestamp)}</span>
          <span class="entry-level"  data-level="${escape(e.level)}">${escape(e.level)}</span>
          <span class="entry-source" data-source="${escape(e.source || '?')}" title="${escape(e.source || '?')}">${escape(e.source || '?')}</span>
          <span class="entry-args"   data-level="${escape(e.level)}">${e.args.map((a) => escape(a)).join(' ')}</span>
        </div>
      `).join('');

      if (autoscroll.checked || wasNearBottom) {
        output.scrollTop = output.scrollHeight;
      }
    }

    function addEntry(entry) {
      entries.push(entry);
      if (entries.length > MAX_ENTRIES) entries.splice(0, entries.length - MAX_ENTRIES);
      lastUpdate.textContent = `LAST ${formatTime(entry.timestamp)}`;
      render();
    }

    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'aura.console') {
        addEntry(d);
      } else if (d.type === 'aura.console.backlog' && Array.isArray(d.entries)) {
        entries = d.entries.slice(-MAX_ENTRIES);
        if (entries.length > 0) {
          lastUpdate.textContent = `LAST ${formatTime(entries[entries.length - 1].timestamp)}`;
        }
        render();
      }
    });

    // Cold-load: seed from the on-disk JSONL log (persists across shell reloads).
    // After that, the shell will (if still open) push its in-memory buffer via
    // postMessage with type='aura.console.backlog', which replaces this list with
    // its more recent view.
    fetch('api/log/recent?limit=500')
      .then((r) => r.ok ? r.json() : null)
      .then((data) => {
        if (!data || !Array.isArray(data.entries) || data.entries.length === 0) return;
        entries = data.entries.slice(-MAX_ENTRIES);
        lastUpdate.textContent = `LAST ${formatTime(entries[entries.length - 1].timestamp)}`;
        render();
      })
      .catch(() => undefined);

    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'aura.console.requestBacklog' }, '*'); } catch (_) {}
    }

    filterBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const lvl = btn.dataset.level;
        if (activeLevels.has(lvl)) {
          activeLevels.delete(lvl);
          btn.dataset.active = 'false';
        } else {
          activeLevels.add(lvl);
          btn.dataset.active = 'true';
        }
        render();
      });
    });

    search.addEventListener('input', () => {
      query = search.value;
      render();
    });

    // Toggling autoscroll back on should jump straight to the bottom — without
    // this the user would have to wait for the next entry before catching up.
    autoscroll.addEventListener('change', () => {
      if (autoscroll.checked) output.scrollTop = output.scrollHeight;
    });

    clearBtn.addEventListener('click', () => {
      entries = [];
      lastUpdate.textContent = '—';
      render();
    });

    copyBtn.addEventListener('click', async () => {
      const text = filtered().map((e) =>
        `${formatTime(e.timestamp)} [${e.level.toUpperCase()}] (${e.source || '?'}) ${e.args.join(' ')}`
      ).join('\n');
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'COPIED';
        setTimeout(() => { copyBtn.textContent = 'COPY'; }, 1000);
      } catch {
        copyBtn.textContent = 'COPY FAILED';
        setTimeout(() => { copyBtn.textContent = 'COPY'; }, 1500);
      }
    });

    render();
  </script>
</body>
</html>
