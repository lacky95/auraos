# AuraOS terminal — tmux as an INVISIBLE persistence layer.
#
# tmux is not a feature here, it's plumbing: it decouples the shell's lifetime
# from the PTY's. Without it, the shell dies whenever the PTY dies — an app
# restart, a code reload, a pty-server crash. With it, the PTY is just a pipe
# the browser attaches to, and the shell (cwd, env, running commands, scrollback)
# lives in the tmux server until the user ends it or the container stops.
#
# Everything below exists to make tmux LOOK like it isn't there. Anything that
# would announce itself — a status bar, a key prefix stealing Ctrl-B, mouse
# capture, the alternate screen — is turned off. Loaded via `-f` when the
# pty-server spawns the session (see spawn() in pty-server.ts).

# No status bar. The OS already draws the terminal's chrome.
set -g status off

# Deep scrollback inside tmux — this is what survives a PTY respawn, so it
# should comfortably outlast the pty-server's own 256 KiB replay ring.
set -g history-limit 50000

# No escape-sequence guess delay. The default 500ms makes Esc feel laggy in
# vim / TUIs, which is exactly the kind of tell that gives tmux away.
set -sg escape-time 0

set -g default-terminal "xterm-256color"

# Keep the BROWSER terminal's native scrollback working. tmux normally switches
# the outer terminal to its alternate screen (smcup), which freezes xterm.js's
# scrollback and kills mouse-wheel scrolling. Stripping smcup/rmcup keeps tmux
# on the normal screen, so output flows into xterm's own scrollback exactly as
# it does today. Programs running INSIDE tmux still get a proper alternate
# screen — tmux emulates that itself — so vim/htop don't pollute the buffer.
set -ga terminal-overrides ',*:smcup@:rmcup@'

# Forward the shell's OSC window title through to the browser. The terminal
# page reads it via xterm's onTitleChange to render the session-host indicator
# (and to follow the user across `aura jump`). tmux swallows the title by
# default, which would freeze that indicator on its boot value.
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# A detached session must never be reaped — that's the entire point.
set -g destroy-unattached off

# Mouse OFF: with mouse mode on, tmux captures wheel/selection and the user
# loses native text selection and copy in the browser terminal.
set -g mouse off
